<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <title>BCK Studio — Loading | Garry's Mod</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    /* Фон — всегда на весь экран (важно для GMod CEF) */
    .scene {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: #0d0d0d;
    }

    /* Фото фона (путь относительно loading.html на сервере) */
    .scene-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #0d0d0d;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Затемнение + виньетка в стиле Source/GMod */
    .scene::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.5) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.35) 0%, transparent 35%, transparent 65%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
    }

    /* Контейнер контента — на весь экран, по центру (для GMod) */
    .ui {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Логотип в центре: иконка слева от названия */
    .logo-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 3vw, 20px);
      text-align: center;
      padding: 0 clamp(16px, 5vw, 24px);
      max-width: 100%;
    }

    .logo-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: clamp(12px, 3vw, 20px);
      flex-wrap: wrap;
      justify-content: center;
    }

    .logo-icon {
      width: clamp(64px, 20vw, 100px);
      height: clamp(64px, 20vw, 100px);
      min-width: 64px;
      min-height: 64px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4));
    }

    .logo-title {
      font-size: clamp(1.35rem, 4vw + 1rem, 3.5rem);
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: clamp(0.05em, 1.5vw, 0.15em);
      text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 0, 0, 0.5);
      word-break: keep-all;
      hyphens: none;
    }

    /* Предупреждение 18+ внизу слева */
    .warning-18 {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: max(16px, env(safe-area-inset-left));
      right: max(16px, env(safe-area-inset-right));
      max-width: 560px;
      display: flex;
      align-items: flex-start;
      gap: clamp(10px, 2.5vw, 16px);
      padding: 0;
    }

    .warning-18 .icon {
      flex-shrink: 0;
      width: clamp(36px, 10vw, 48px);
      height: clamp(36px, 10vw, 48px);
      min-width: 36px;
      min-height: 36px;
      margin-top: 4px;
      border: clamp(4px, 1.2vw, 6px) solid #e4e4e4;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: clamp(22px, 6vw, 32px);
      font-weight: 800;
      -webkit-text-stroke: 1px #fff;
      text-stroke: 10px #fff;
    }

    .warning-18 .text {
      color: #fff;
      font-size: clamp(0.875rem, 2.5vw + 0.5rem, 22px);
      line-height: 1.35;
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 900;
      min-width: 0;
    }

    /* Очень узкие экраны (маленькие смартфоны) */
    @media (max-width: 359px) {
      .logo-row {
        flex-direction: column;
        gap: 8px;
      }
      .logo-title {
        font-size: 1.25rem;
        letter-spacing: 0.04em;
      }
      .warning-18 {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 8px;
      }
      .warning-18 .icon {
        margin-top: 0;
      }
    }

    /* Высокие узкие экраны (портрет) */
    @media (max-height: 500px) and (orientation: portrait) {
      .logo-block {
        gap: 8px;
      }
      .logo-icon {
        width: 56px;
        height: 56px;
        min-width: 56px;
        min-height: 56px;
        padding: 10px;
      }
      .logo-title {
        font-size: 1.25rem;
      }
      .warning-18 {
        bottom: max(10px, env(safe-area-inset-bottom));
      }
      .warning-18 .text {
        font-size: 0.8125rem;
      }
    }

    /* Горизонтальная ориентация на мобильных */
    @media (max-width: 768px) and (orientation: landscape) {
      .logo-block {
        gap: 10px;
      }
      .logo-icon {
        width: 56px;
        height: 56px;
        min-width: 56px;
        min-height: 56px;
      }
      .logo-title {
        font-size: clamp(1.1rem, 3vw + 0.5rem, 1.75rem);
      }
      .warning-18 .text {
        font-size: 0.875rem;
      }
    }

    /* Широкие экраны — центрирование предупреждения по горизонтали не меняем, left остаётся */
    @media (min-width: 1200px) {
      .logo-title {
        letter-spacing: 0.15em;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="scene-bg"></div>
  </div>

  <div class="ui">
    <div class="logo-block">
      <div class="logo-row">
        <div class="logo-icon">
          <img src="logo.jpg" alt="BCK Studio" width="100" height="100" loading="eager">
        </div>
        <h1 class="logo-title">BCK-Studio</h1>
      </div>
    </div>

    </div>

    <div class="warning-18">
      <span class="icon">!</span>
      <span class="text">This server contains 18+ content. If you are under 18, please leave the server!</span>
    </div>
  </div>

</body>
</html>
